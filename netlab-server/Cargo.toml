[package]
name = "netlab-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "luatos-netlab Rust backend — TCP/UDP/SSL port allocator over WebSocket"
license = "MIT"

[lib]
name = "netlab_server"
path = "src/lib.rs"

[[bin]]
name = "netlab-server"
path = "src/main.rs"

[dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"

# http + ws
axum = { version = "0.7", features = ["ws", "macros"] }
tokio-tungstenite = "0.24"
tower = "0.4"
tower-http = { version = "0.6", features = ["fs", "trace"] }
http = "1"

# tls
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
rcgen = "0.13"

# data structures
dashmap = "6"
parking_lot = "0.12"
arc-swap = "1"
once_cell = "1"
rand = "0.8"

# serde + util
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
hex = "0.4"
thiserror = "1"

# observability
metrics = "0.23"
metrics-exporter-prometheus = { version = "0.15", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-futures = "0.2"

# config
config = { version = "0.14", default-features = false, features = ["toml"] }
toml = "0.8"

# async trait
async-trait = "0.1"

# error handling
anyhow = "1"

[dev-dependencies]
mockall = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
pretty_assertions = "1"
tokio-tungstenite = "0.24"

# Relax the 2024 never-type lint so existing code that relies on
# the previous default can keep compiling. The denylist was promoted
# to an error in recent toolchains but the affected call sites
# (e.g. config::NetlabConfig::load) are deliberately out of scope
# for the current refactor wave.
[lints.rust]
dependency_on_unit_never_type_fallback = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
